version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    labels: [dependencies, nuget]
